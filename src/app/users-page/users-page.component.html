<section class="users-page" aria-labelledby="users-title">
  <h1 id="users-title">Список Пользователей</h1>

  <div
    id="users-list-region"
    class="users-page__scroll"
    role="region"
    aria-labelledby="users-title"
    tabindex="0"
  >
    <div class="users-page__content">
      @if (hasLoaded()) {
        <app-user-create (userCreated)="addUser($event)" />
        <app-users-filter (filterChanged)="setNameFilter($event)" />

        @if (filteredUsers$ | async; as users) {
          @if (users.length) {
            <ul class="user-cards" role="list">
              @for (user of users; track user.id) {
                <li>
                  <app-user-card [user]="user" (userDeleted)="removeUser($event)" />
                </li>
              }
            </ul>
          } @else {
            <p class="users-page__empty" role="status">Нет пользователей для отображения</p>
          }
        }
      }
    </div>
  </div>
</section>
