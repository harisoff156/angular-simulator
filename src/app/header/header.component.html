<header class="navbar">
  <nav class="navbar__inner" aria-label="Главная навигация">
    <a class="navbar__logo" routerLink="/">
      <img class="navbar__logo-icon" src="/icons/logo.svg" alt="" width="137" height="48" />
      <span class="navbar__logo-text">{{ companyName }}</span>
    </a>

    <ul class="navbar__links">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="navbar__link--active"
            [routerLinkActiveOptions]="activeLinkOptions"
            ariaCurrentWhenActive="page"
          >{{ link.label }}</a>
        </li>
      }
    </ul>

    <a class="navbar__button" href="#contacts">Консультация</a>
  </nav>

  <div class="navbar__settings">
    <p-selectbutton
      [options]="themeOptions"
      [ngModel]="theme$ | async"
      (ngModelChange)="changeTheme($event)"
      optionLabel="label"
      optionValue="value"
      size="small"
      ariaLabelledBy="theme-label"
    />
    <span id="theme-label" class="navbar__visually-hidden">Тема оформления</span>

    <div class="navbar__mode">
      <fa-icon [icon]="['fas', 'sun']" />
      <p-toggleswitch
        [ngModel]="isDark$ | async"
        (ngModelChange)="changeMode($event)"
        ariaLabel="Тёмный режим"
      />
      <fa-icon [icon]="['fas', 'moon']" />
    </div>
  </div>

  <div class="navbar__widgets">
    <div class="navbar__widget">
      @if (isTimerVisible) {
        <p class="navbar__date">{{ currentDate }}</p>
      } @else {
        <div class="navbar__counter" aria-label="Счётчик кликов">
          <button type="button" (click)="increaseCount()" aria-label="Увеличить счётчик">
            +
          </button>
          <output aria-live="polite">{{ clickCount }}</output>
          <button
            type="button"
            (click)="decreaseCount()"
            [disabled]="clickCount === 0"
            aria-label="Уменьшить счётчик"
          >
            −
          </button>
        </div>
      }
    </div>

    <button class="navbar__toggle" type="button" (click)="toggleWidget()">
      {{ isTimerVisible ? 'Показать кликер' : 'Показать дату' }}
    </button>
  </div>
</header>
