@if (isLoading) {
  <div class="page-loader" role="status" aria-label="Загрузка страницы">
    <svg
      class="page-loader__spinner"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 11a9 9 0 0 1 15.36-6.36L21 7" />
      <path d="M21 3v4h-4" />
      <path d="M21 13a9 9 0 0 1-15.36 6.36L3 17" />
      <path d="M3 21v-4h4" />
    </svg>
    <span>Загрузка...</span>
  </div>
} @else {
  <app-navbar />
  <app-hero />
  <app-about-hike />
  <app-programs />
  <app-destinations (showMessage)="messageService.addMessage($event, messageType.Info)" />
  <app-travel-blog (showMessage)="messageService.addMessage($event, messageType.Info)" />
  <section class="message-demo" aria-labelledby="message-demo-title">
    <h2 id="message-demo-title">Уведомления</h2>
    <div class="message-demo__buttons">
      <button type="button" (click)="messageService.addMessage('Действие выполнено успешно', messageType.Success)">Успех</button>
      <button type="button" (click)="messageService.addMessage('Новая информация', messageType.Info)">Информация</button>
      <button type="button" (click)="messageService.addMessage('Обратите внимание', messageType.Warning)">Предупреждение</button>
      <button type="button" (click)="messageService.addMessage('Произошла ошибка', messageType.Error)">Ошибка</button>
    </div>
  </section>
  <router-outlet />
}

<div class="messages" aria-live="polite" aria-relevant="additions">
  @for (message of messageService.messages; track message.id) {
    <ng-container [ngTemplateOutlet]="messageTemplate" [ngTemplateOutletContext]="{ $implicit: message }" />
  }
</div>

<ng-template #messageTemplate let-message>
  <div class="message" [class]="'message message--' + message.type">
    <span class="message__text">{{ message.text }}</span>
    <button class="message__close" type="button" aria-label="Закрыть уведомление" (click)="messageService.closeMessage(message.id)">×</button>
  </div>
</ng-template>
